<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분양콕 - 부동산 광고 통합 제안서</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        :root {
            --primary-color: #007bff;
        }
        body {
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
        }
        .page-container {
            overflow-x: hidden;
        }
        .page-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        /* === 꾸미기 효과 1: 세련된 배경 및 구분선 === */
        .section-divider {
            padding: 60px 20px;
            background: linear-gradient(to bottom, #ffffff, #f8f9fa); /* 은은한 그라데이션 배경 */
            margin: 0 auto;
        }
        .section-divider h2 {
            font-size: 2.2em;
            font-weight: 900;
            margin-bottom: 20px;
            position: relative;
        }
        /* 제목 아래 장식용 라인 추가 */
        .section-divider h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
            margin: 20px auto 0 auto;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .shorts-container {
            max-width: 360px;
            padding-bottom: 640px;
        }
        /* 비디오 위에 마우스 올렸을 때 효과 */
        .video-container:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* === 꾸미기 효과 2: 스크롤 애니메이션 === */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease-out, transform 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="page-container">
        <img src="page_01.png" alt="제안서 1페이지" class="page-image reveal">
        <img src="page_02.png" alt="제안서 2페이지" class="page-image reveal">
        <img src="page_03.png" alt="제안서 3페이지" class="page-image reveal">
        <img src="page_04.png" alt="제안서 4페이지" class="page-image reveal">
        <img src="page_05.png" alt="제안서 5페이지" class="page-image reveal">
        <img src="page_06.png" alt="제안서 6페이지" class="page-image reveal">
        <img src="page_07.png" alt="제안서 7페이지" class="page-image reveal">
        <img src="page_08.png" alt="제안서 8페이지" class="page-image reveal">
        <img src="page_09.png" alt="제안서 9페이지" class="page-image reveal">
        <img src="page_10.png" alt="제안서 10페이지" class="page-image reveal">
        <img src="page_11.png" alt="제안서 11페이지" class="page-image reveal">
        <img src="page_12.png" alt="제안서 12페이지" class="page-image reveal">
        <img src="page_13.png" alt="제안서 13페이지" class="page-image reveal">
        <img src="page_14.png" alt="제안서 14페이지" class="page-image reveal">
        <img src="page_15.png" alt="제안서 15페이지" class="page-image reveal">
        <img src="page_16.png" alt="제안서 16페이지" class="page-image reveal">
        
        <div class="section-divider reveal">
            <h2>'집보러 왔수다' 대표 영상</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/DG_xJsOomq8?si=oWHzT2c-3YyIHblx" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
        
        <img src="page_17.png" alt="제안서 17페이지" class="page-image reveal">
        <img src="page_18.png" alt="제안서 18페이지" class="page-image reveal">
        <img src="page_19.png" alt="제안서 19페이지" class="page-image reveal">

        <div class="section-divider reveal">
            <h2>인스타그램 숏폼 샘플 영상</h2>
            <div class="video-container shorts-container">
                <iframe src="http://googleusercontent.com/youtube.com/embed/P-2u32n2O_k" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <img src="page_22.png" alt="제안서 22페이지" class="page-image reveal">

        <img src="page_25.png" alt="제안서 25페이지" class="page-image reveal">

        <img src="page_28.png" alt="제안서 28페이지" class="page-image reveal">
        <img src="page_29.png" alt="제안서 29페이지" class="page-image reveal">
    </div>

    <script>
        function revealSections() {
            const reveals = document.querySelectorAll('.reveal');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1 });
            reveals.forEach(reveal => { observer.observe(reveal); });
        }
        revealSections();
    </script>

</body>
</html>
