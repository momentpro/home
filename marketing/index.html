<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분양콕 - 부동산 광고 통합 제안서</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f2f5; /* A light grey background to frame the pages */
            font-family: sans-serif;
            text-align: center; /* Center everything */
        }
        .page-image {
            max-width: 100%;
            height: auto;
            display: block; /* Removes bottom space */
            margin: 0 auto; /* Center the image */
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .section-divider {
            padding: 40px 20px;
            background-color: #ffffff;
            margin: 0 auto;
        }
        .section-divider h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            max-width: 1000px; /* Limit video size */
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <img src="page_01.png" alt="제안서 1페이지: 메인 타이틀" class="page-image">
    <img src="page_03.png" alt="제안서 3페이지: 회사 슬로건" class="page-image">
    <img src="page_05.png" alt="제안서 5페이지: 광고 운영 성과" class="page-image">
    <img src="page_09.png" alt="제안서 9페이지: 광고 운영 프로세스" class="page-image">
    <img src="page_14.png" alt="제안서 14페이지: 집보러 왔수다 소개" class="page-image">

    <div class="section-divider">
        <h2>'집보러 왔수다' 대표 영상</h2>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>
    
    <img src="page_18.png" alt="제안서 18페이지: 집보러 왔수다 가격표" class="page-image">
    <img src="page_19.png" alt="제안서 19페이지: 인스타그램 숏폼 소개" class="page-image">
    <img src="page_24.png" alt="제안서 24페이지: 채널 운영 소개" class="page-image">
    <img src="page_27.png" alt="제안서 27페이지: 오프라인 광고 소개" class="page-image">
    <img src="page_29.png" alt="제안서 29페이지: 연락처 정보" class="page-image">

</body>
</html>
