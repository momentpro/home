<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분양콕 - 부동산 광고 통합 제안서</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        :root {
            --primary-color: #007bff;
        }

        body {
            margin: 0;
            background-color: #f0f2f5;
            font-family: 'Noto Sans KR', sans-serif;
            text-align: center;
        }
        .page-container {
            overflow-x: hidden; /* 가로 스크롤 방지 */
        }
        .page-image {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .section-divider {
            padding: 60px 20px;
            background: linear-gradient(to bottom, #ffffff, #f8f9fa); /* 은은한 그라데이션 배경 */
            margin: 0 auto;
        }
        .section-divider h2 {
            font-size: 2.2em;
            font-weight: 900;
            margin-bottom: 20px;
            position: relative;
        }
        .section-divider h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
            margin: 20px auto 0 auto;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        /* 쇼츠 영상은 세로 비율이므로 별도 스타일 적용 */
        .shorts-container {
            max-width: 360px; /* 쇼츠 영상에 적합한 가로 크기 */
            padding-bottom: 640px; /* 9:16 비율에 가까운 높이 */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1em;
            transition: all 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
        }

        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease-out, transform 0.8s ease-out;
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="page-container">
        <img src="page_01.png" alt="제안서 1페이지: 메인 타이틀" class="page-image reveal">
        <img src="page_03.png" alt="제안서 3페이지: 회사 슬로건" class="page-image reveal">
        
        <div class="section-divider reveal"><h2>핵심 성과</h2></div>
        <img src="page_05.png" alt="제안서 5페이지: 광고 운영 성과" class="page-image reveal">
        
        <div class="section-divider reveal"><h2>주요 성공 사례</h2></div>
        <img src="page_04.png" alt="제안서 4페이지: 포트폴리오 1" class="page-image reveal">
        <img src="page_07.png" alt="제안서 7페이지: 포트폴리오 2" class="page-image reveal">

        <div class="section-divider reveal"><h2>체계적인 운영 시스템</h2></div>
        <img src="page_08.png" alt="제안서 8페이지: KRMI 데이터랩 소개" class="page-image reveal">
        <img src="page_09.png" alt="제안서 9페이지: 광고 운영 프로세스" class="page-image reveal">

        <div class="section-divider reveal"><h2>대표 콘텐츠: 집보러 왔수다</h2></div>
        <img src="page_14.png" alt="제안서 14페이지: 집보러 왔수다 소개" class="page-image reveal">
        <img src="page_15.png" alt="제안서 15페이지: 메인 MC 소개" class="page-image reveal">
        <img src="page_16.png" alt="제안서 16페이지: 콘텐츠 예시" class="page-image reveal">
        
        <div class="section-divider reveal">
            <h2>'집보러 왔수다' 대표 영상</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/..." title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
        
        <div class="section-divider reveal"><h2>전체 서비스 상세 안내</h2></div>
        <img src="page_18.png" alt="제안서 18페이지: 집보러 왔수다 가격표" class="page-image reveal">
        
        <img src="page_19.png" alt="제안서 19페이지: 인스타그램 숏폼 서비스" class="page-image reveal">
        <div class="section-divider reveal">
            <h2>인스타그램 숏폼 샘플 영상</h2>
            <div class="video-container shorts-container">
                <iframe src="googleusercontent.com/youtube.com/" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <img src="page_20.png" alt="제안서 20페이지: 서포터.ZIP 서비스" class="page-image reveal">
        <div class="section-divider reveal">
            <h2>서포터.ZIP 후기 샘플 영상</h2>
            <div class="video-container shorts-container">
                <iframe src="youtube.com/embed/" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>

        <img src="page_21.png" alt="제안서 21페이지: 브로슈어 전자책 서비스" class="page-image reveal">
        <div class="section-divider reveal">
            <h2>브로슈어/이벤트 관련 페이지</h2>
            <p style="margin-bottom:25px; font-size: 1.1em;">콘텐츠와 연계하여 진행했던 이벤트 페이지 예시입니다.</p>
            <a href="https://momentintl.com/icheon-bubal-efete/" target="_blank" class="btn">샘플 페이지 보러가기</a>
        </div>


        <div class="section-divider reveal"><h2>광고 채널 및 집행 예시</h2></div>
        <img src="page_24.png" alt="제안서 24페이지: 채널 운영 소개" class="page-image reveal">
        <img src="page_25.png" alt="제안서 25페이지: 온라인 광고 종류 예시" class="page-image reveal">

        <div class="section-divider reveal"><h2>온/오프라인 통합 마케팅</h2></div>
        <img src="page_27.png" alt="제안서 27페이지: 오프라인 광고 소개" class="page-image reveal">
        <img src="page_28.png" alt="제안서 28페이지: 오프라인 광고 예시" class="page-image reveal">

        <div class="section-divider reveal"><h2>문의 및 제휴 안내</h2></div>
        <img src="page_29.png" alt="제안서 29페이지: 연락처 정보" class="page-image reveal">
    </div>

    <script>
        function revealSections() {
            const reveals = document.querySelectorAll('.reveal');

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1 // 10% 보이면 애니메이션 시작
            });

            reveals.forEach(reveal => {
                observer.observe(reveal);
            });
        }
        revealSections();
    </script>

</body>
</html>
