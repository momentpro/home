<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딜하르방 - 무지개 요트 신청하기</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        :root {
            --primary-brand: #005A9C;
            --secondary-accent: #F7C852;
            --background: #F9F9F9;
            --text-dark: #333333;
            --text-light: #767676;
            --card-background: #FFFFFF;
            --error-color: #e74c3c;
            --success-color: #27ae60;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary-brand) 0%, #0066b3 100%);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 90, 156, 0.15);
            position: relative;
            animation: slideInFromLeft 0.8s ease-out;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
        }

        .back-link::before {
            content: '←';
            margin-right: 8px;
            font-size: 18px;
        }

        /* Main Content */
        .main-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .main-title {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 40px;
            line-height: 1.3;
            animation: fadeInUp 0.8s ease-out 0.5s both;
        }

        .main-title .highlight {
            color: var(--primary-brand);
            position: relative;
        }

        .main-title .highlight::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--secondary-accent), var(--primary-brand));
            border-radius: 2px;
        }

        /* Form Container */
        .form-container {
            background: var(--card-background);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.8s ease-out 0.7s both;
            position: relative;
            overflow: hidden;
        }

        .form-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-brand), var(--secondary-accent));
        }

        .form-intro {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 90, 156, 0.05);
            border-radius: 12px;
            border-left: 4px solid var(--primary-brand);
        }

        .form-intro h3 {
            font-size: 20px;
            color: var(--primary-brand);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .form-intro p {
            font-size: 16px;
            color: var(--text-light);
            line-height: 1.5;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 16px;
        }

        .form-group label .required {
            color: var(--error-color);
            margin-left: 4px;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-brand);
            background: white;
            box-shadow: 0 0 0 3px rgba(0, 90, 156, 0.1);
        }

        .form-control.error {
            border-color: var(--error-color);
            background: rgba(231, 76, 60, 0.05);
        }

        .form-control.success {
            border-color: var(--success-color);
            background: rgba(39, 174, 96, 0.05);
        }

        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Select Styling */
        select.form-control {
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6,9 12,15 18,9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            padding-right: 50px;
        }

        /* Checkbox Styling */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 20px 0;
        }

        .checkbox-input {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 14px;
            line-height: 1.5;
            color: var(--text-light);
            cursor: pointer;
            margin: 0;
        }

        /* Button */
        .submit-button {
            width: 100%;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, #f5d76e 100%);
            color: var(--text-dark);
            border: none;
            border-radius: 25px;
            padding: 18px 40px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .submit-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .submit-button:hover::before {
            left: 100%;
        }

        .submit-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(247, 200, 82, 0.4);
        }

        .submit-button:active {
            transform: translateY(-1px);
        }

        .submit-button:disabled {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .submit-button.loading::after {
            content: '';
            width: 20px;
            height: 20px;
            border: 2px solid #999;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Success/Error Messages */
        .message {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .message.success {
            background: rgba(39, 174, 96, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(39, 174, 96, 0.3);
        }

        .message.error {
            background: rgba(231, 76, 60, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .message.show {
            display: block;
            animation: fadeInUp 0.5s ease-out;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .main-content {
                padding: 60px 40px;
            }

            .main-title {
                font-size: 32px;
                margin-bottom: 50px;
            }

            .form-container {
                padding: 50px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="yacht-detail.html" class="back-link">뒤로 가기</a>
    </header>

    <main class="main-content">
        <h1 class="main-title">
            <span class="highlight">무지개 요트</span> 투어 신청하기
        </h1>
        
        <div class="form-container">
            <div class="form-intro">
                <h3>🛥️ 제주 바다의 낭만을 만끽하세요!</h3>
                <p>무지개 요트 투어 특별 할인 혜택을 신청해보세요.</p>
            </div>

            <div id="success-message" class="message success">
                신청이 완료되었습니다! 빠른 시일 내에 연락드리겠습니다. 🛥️
            </div>
            
            <div id="error-message" class="message error">
                신청 중 오류가 발생했습니다. 다시 시도해주세요.
            </div>

            <form id="yacht-application-form" novalidate>
                <div class="form-group">
                    <label for="name">이름 <span class="required">*</span></label>
                    <input type="text" id="name" name="name" class="form-control" required>
                    <div class="error-message">이름을 입력해주세요.</div>
                </div>

                <div class="form-group">
                    <label for="phone">연락처 <span class="required">*</span></label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="010-1234-5678" required>
                    <div class="error-message">올바른 연락처를 입력해주세요.</div>
                </div>

                <div class="form-group">
                    <label for="tour_type">투어 종류 <span class="required">*</span></label>
                    <select id="tour_type" name="tour_type" class="form-control" required>
                        <option value="">투어를 선택해주세요</option>
                        <option value="퍼블릭(데이)투어">🌊 퍼블릭(데이)투어 - 37,000원</option>
                        <option value="선셋투어">🌅 선셋투어 - 42,000원</option>
                        <option value="해녀와 함께하는 요트투어">🤿 해녀와 함께하는 요트투어 - 45,000원</option>
                    </select>
                    <div class="error-message">투어 종류를 선택해주세요.</div>
                </div>

                <div class="form-group">
                    <label for="visitDate">방문 희망일 <span class="required">*</span></label>
                    <input type="date" id="visitDate" name="visitDate" class="form-control" required>
                    <div class="error-message">방문 희망일을 선택해주세요.</div>
                    <small style="color: var(--text-light); margin-top: 5px; display: block;">
                        📅 투어 문의: 064-745-1324 (출항시간 확인 필수)
                    </small>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="privacy" name="privacy" class="checkbox-input" required>
                    <label for="privacy" class="checkbox-label">
                        개인정보 수집 및 이용에 동의합니다. <span class="required">*</span><br>
                        <small>수집된 개인정보는 투어 안내 목적으로만 사용되며, 관련 법령에 따라 안전하게 관리됩니다.</small>
                    </label>
                </div>

                <button type="submit" class="submit-button">
                    🛥️ 무지개 요트 투어 신청하기
                </button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('yacht-application-form');
            const submitButton = document.querySelector('.submit-button');
            const successMessage = document.getElementById('success-message');
            const errorMessage = document.getElementById('error-message');

            // 무지개 요트 전용 Google Apps Script URL
            const YACHT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz5FiU4fxrHzHSDoP5QEFd-xfRHemTA0F_rNBcvJPix4jIwb1OreBzEzQYALCyTJpZUDA/exec';

            // Form validation
            function validateForm() {
                let isValid = true;
                const formData = new FormData(form);
                
                // Clear previous error states
                document.querySelectorAll('.form-control').forEach(control => {
                    control.classList.remove('error', 'success');
                });
                document.querySelectorAll('.error-message').forEach(msg => {
                    msg.classList.remove('show');
                });

                // Validate name
                const name = formData.get('name').trim();
                if (!name) {
                    showFieldError('name', '이름을 입력해주세요.');
                    isValid = false;
                } else if (name.length < 2) {
                    showFieldError('name', '이름은 2자 이상 입력해주세요.');
                    isValid = false;
                } else {
                    showFieldSuccess('name');
                }

                // Validate phone
                const phone = formData.get('phone').trim();
                const phoneRegex = /^01[0-9]-?[0-9]{3,4}-?[0-9]{4}$/;
                if (!phone) {
                    showFieldError('phone', '연락처를 입력해주세요.');
                    isValid = false;
                } else if (!phoneRegex.test(phone.replace(/-/g, ''))) {
                    showFieldError('phone', '올바른 연락처 형식으로 입력해주세요.');
                    isValid = false;
                } else {
                    showFieldSuccess('phone');
                }

                // Validate tour type
                const tourType = formData.get('tour_type');
                if (!tourType) {
                    showFieldError('tour_type', '투어 종류를 선택해주세요.');
                    isValid = false;
                } else {
                    showFieldSuccess('tour_type');
                }

                // Validate visit date
                const visitDate = formData.get('visitDate');
                if (!visitDate) {
                    showFieldError('visitDate', '방문 희망일을 선택해주세요.');
                    isValid = false;
                } else {
                    showFieldSuccess('visitDate');
                }

                // Validate privacy checkbox
                const privacy = document.getElementById('privacy').checked;
                if (!privacy) {
                    showFieldError('privacy', '개인정보 수집 및 이용에 동의해주세요.');
                    isValid = false;
                }

                return isValid;
            }

            function showFieldError(fieldName, message) {
                const field = document.getElementById(fieldName);
                const errorMsg = field.parentNode.querySelector('.error-message');
                
                field.classList.add('error');
                if (errorMsg) {
                    errorMsg.textContent = message;
                    errorMsg.classList.add('show');
                }
            }

            function showFieldSuccess(fieldName) {
                const field = document.getElementById(fieldName);
                field.classList.add('success');
            }

            // Phone number formatting
            document.getElementById('phone').addEventListener('input', function(e) {
                let value = e.target.value.replace(/[^0-9]/g, '');
                if (value.length >= 3 && value.length <= 7) {
                    value = value.replace(/(\d{3})(\d+)/, '$1-$2');
                } else if (value.length > 7) {
                    value = value.replace(/(\d{3})(\d{4})(\d+)/, '$1-$2-$3');
                }
                e.target.value = value;
            });

            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Hide previous messages
                successMessage.classList.remove('show');
                errorMessage.classList.remove('show');

                if (!validateForm()) {
                    return;
                }

                // Show loading state
                submitButton.classList.add('loading');
                submitButton.textContent = '신청 중...';
                submitButton.disabled = true;

                try {
                    const formData = new FormData(form);
                    
                    // Store applicant name for thank you page
                    localStorage.setItem('applicantName', formData.get('name'));
                    localStorage.setItem('applicantPhone', formData.get('phone'));

                    // Submit to Google Sheets
                    try {
                        // CORS 문제 해결을 위해 form 방식으로 전송
                        const params = new URLSearchParams();
                        params.append('name', formData.get('name'));
                        params.append('phone', formData.get('phone'));
                        params.append('tour_type', formData.get('tour_type'));
                        params.append('visitDate', formData.get('visitDate'));
                        params.append('timestamp', new Date().toLocaleString('ko-KR'));

                        // iframe을 이용한 form 제출 (CORS 우회)
                        const iframe = document.createElement('iframe');
                        iframe.style.display = 'none';
                        iframe.name = 'hiddenFrame';
                        document.body.appendChild(iframe);

                        const form = document.createElement('form');
                        form.method = 'POST';
                        form.action = YACHT_SCRIPT_URL;
                        form.target = 'hiddenFrame';

                        // 파라미터를 hidden input으로 추가
                        for (const [key, value] of params.entries()) {
                            const input = document.createElement('input');
                            input.type = 'hidden';
                            input.name = key;
                            input.value = value;
                            form.appendChild(input);
                        }

                        document.body.appendChild(form);
                        form.submit();

                        // cleanup
                        setTimeout(() => {
                            document.body.removeChild(form);
                            document.body.removeChild(iframe);
                        }, 1000);

                        console.log('무지개 요트 신청 전송 완료');
                    } catch (error) {
                        console.error('무지개 요트 신청 전송 오류:', error);
                    }

                    // Show success and redirect
                    successMessage.classList.add('show');
                    
                    setTimeout(() => {
                        window.location.href = 'thank-you.html';
                    }, 2000);

                } catch (error) {
                    console.error('Submission error:', error);
                    errorMessage.classList.add('show');
                    
                    // Reset button state
                    submitButton.classList.remove('loading');
                    submitButton.textContent = '🛥️ 무지개 요트 투어 신청하기';
                    submitButton.disabled = false;
                }
            });

            console.log('무지개 요트 신청 페이지가 성공적으로 로드되었습니다! 🛥️');
        });
    </script>
</body>
</html>
