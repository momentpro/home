<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딜하르방 - 신청 완료</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        :root {
            --primary-brand: #005A9C;
            --secondary-accent: #F7C852;
            --background: #F9F9F9;
            --text-dark: #333333;
            --text-light: #767676;
            --card-background: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #e8f4fd 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes checkmarkAnimation {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-45deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.1) rotate(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Thank You Container */
        .thank-you-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        /* Background decoration */
        .thank-you-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 90, 156, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(247, 200, 82, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 60% 20%, rgba(0, 90, 156, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Success Card */
        .success-card {
            background: var(--card-background);
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            position: relative;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
            overflow: hidden;
        }

        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary-brand), var(--secondary-accent), var(--primary-brand));
        }

        /* Checkmark */
        .checkmark {
            font-size: 80px;
            margin-bottom: 30px;
            animation: checkmarkAnimation 1.2s ease-out 0.5s both;
            position: relative;
            display: inline-block;
        }

        .checkmark::after {
            content: '✨';
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 24px;
            animation: sparkle 2s ease-in-out 1.5s infinite;
        }

        .checkmark::before {
            content: '🎉';
            position: absolute;
            top: -15px;
            left: -15px;
            font-size: 20px;
            animation: sparkle 2s ease-in-out 2s infinite;
        }

        /* Title */
        .thank-you-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 20px;
            color: var(--text-dark);
            animation: fadeInUp 0.8s ease-out 0.7s both;
            position: relative;
        }

        .thank-you-title .highlight {
            color: var(--primary-brand);
            position: relative;
        }

        .thank-you-title .highlight::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--secondary-accent), var(--primary-brand));
            border-radius: 2px;
        }

        /* Message */
        .thank-you-message {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 40px;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease-out 0.9s both;
        }

        /* Button */
        .button {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, #f5d76e 100%);
            color: var(--text-dark);
            border-radius: 25px;
            padding: 16px 32px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out 1.1s both;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }

        .button:hover::before {
            left: 100%;
        }

        .button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(247, 200, 82, 0.4);
        }

        .button:active {
            transform: translateY(-1px) scale(1.02);
        }

        /* Floating Elements */
        .floating-element {
            position: absolute;
            animation: float 3s ease-in-out infinite;
            opacity: 0.3;
            pointer-events: none;
        }

        .floating-element:nth-child(1) {
            top: 15%;
            left: 10%;
            font-size: 24px;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            top: 25%;
            right: 15%;
            font-size: 20px;
            animation-delay: 1s;
        }

        .floating-element:nth-child(3) {
            bottom: 20%;
            left: 20%;
            font-size: 28px;
            animation-delay: 2s;
        }

        .floating-element:nth-child(4) {
            bottom: 30%;
            right: 10%;
            font-size: 22px;
            animation-delay: 1.5s;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .success-card {
                padding: 80px 60px;
            }

            .thank-you-title {
                font-size: 36px;
                margin-bottom: 25px;
            }

            .thank-you-message {
                font-size: 20px;
                margin-bottom: 50px;
            }

            .checkmark {
                font-size: 100px;
                margin-bottom: 40px;
            }

            .button {
                font-size: 18px;
                padding: 18px 40px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        .button:focus {
            outline: 3px solid var(--primary-brand);
            outline-offset: 2px;
        }

        /* Loading state */
        .loading {
            opacity: 0;
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>
</head>
<body class="loading">
    <!-- Floating decorative elements -->
    <div class="floating-element">🗿</div>
    <div class="floating-element">🌺</div>
    <div class="floating-element">🏖️</div>
    <div class="floating-element">🌊</div>

    <div class="thank-you-container">
        <div class="success-card">
            <div class="checkmark">✅</div>
            <h1 class="thank-you-title">
                <span class="highlight">딜하르방</span> 신청 완료!
            </h1>
            <p class="thank-you-message">
                빠른 시일 내에 안내 메시지를 발송해 드리겠습니다.<br>
                딜하르방이 책임지고 챙겨드릴게요! 🗿
            </p>
            <a href="index.html" class="button">메인으로 돌아가기</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Remove loading class to trigger animations
            setTimeout(() => {
                document.body.classList.remove('loading');
            }, 100);

            // Optional: Display personalized message if name is stored
            const applicantName = localStorage.getItem('applicantName');
            if (applicantName) {
                const titleElement = document.querySelector('.thank-you-title');
                titleElement.innerHTML = `
                    <span class="highlight">${applicantName}님</span>, 신청 완료!
                `;
                
                // Clear stored data after use
                localStorage.removeItem('applicantName');
                localStorage.removeItem('applicantPhone');
            }

            // Enhanced button interactions
            const button = document.querySelector('.button');
            button.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-3px) scale(1.05)';
            });
            
            button.addEventListener('mouseleave', function() {
                this.style.transform = '';
            });

            // Add confetti effect (visual only)
            function createConfetti() {
                const colors = ['#005A9C', '#F7C852', '#ffffff'];
                const confettiCount = 50;
                
                for (let i = 0; i < confettiCount; i++) {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'absolute';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = '50%';
                    confetti.style.pointerEvents = 'none';
                    confetti.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                    
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }
            }

            // Add fall animation for confetti
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fall {
                    to {
                        transform: translateY(100vh) rotate(360deg);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);

            // Trigger confetti after checkmark animation
            setTimeout(createConfetti, 1700);
            
            console.log('딜하르방 감사 페이지가 성공적으로 로드되었습니다! 🎉');
        });
    </script>
</body>
</html>
