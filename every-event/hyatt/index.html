<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딜하르방 - 페이지를 찾을 수 없습니다</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

        :root {
            --primary-brand: #005A9C;
            --secondary-accent: #F7C852;
            --background: #F9F9F9;
            --text-dark: #333333;
            --text-light: #767676;
            --card-background: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            background: var(--card-background);
            border-radius: 18px;
            padding: 60px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            max-width: 600px;
            width: 100%;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 30px;
        }

        .error-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary-accent) 0%, #f5d76e 100%);
            color: var(--text-dark);
            border-radius: 25px;
            padding: 18px 40px;
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
            cursor: pointer;
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(247, 200, 82, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🗿</div>
        <h1 class="error-title">페이지를 찾을 수 없습니다</h1>
        <p class="error-message">
            죄송합니다. 요청하신 페이지를 찾을 수 없습니다.<br>
            딜하르방 메인 페이지로 돌아가서 다른 혜택을 확인해보세요!
        </p>
        <a href="../" class="back-button">🏠 메인 페이지로 돌아가기</a>
    </div>

    <script>
        // 3초 후 자동으로 메인 페이지로 리다이렉트
        setTimeout(() => {
            window.location.href = '../';
        }, 3000);
    </script>
</body>
</html>
