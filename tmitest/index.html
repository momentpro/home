<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 집 마련 성향 테스트 - TMI Test</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: #f4f4f4;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 60px auto;
      background: #fff;
      border-radius: 10px;
      padding: 30px 20px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }
    .question-box {
      display: none;
      text-align: center;
    }
    .question-box.active {
      display: block;
    }
    .question-text {
      font-size: 20px;
      margin-bottom: 30px;
    }
    .option {
      display: block;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      padding: 14px 20px;
      margin: 10px auto;
      font-size: 16px;
      cursor: pointer;
      width: 90%;
    }
    .result-box {
      display: none;
      text-align: center;
    }
    .result-box h2 {
      font-size: 22px;
      margin-bottom: 20px;
    }
    .cta {
      margin-top: 30px;
      padding: 12px 24px;
      background: #28a745;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      display: inline-block;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="questionContainer"></div>
    <div id="resultBox" class="result-box">
      <h2>당신의 성향 결과는?</h2>
      <p id="resultText"></p>
      <a href="https://momentintl.com/tmitest/form" class="cta">내 조건에 맞는 분양 전략 상담받기</a>
    </div>
  </div>

  <script>
    const questions = [
      {
        text: "내 집 마련에 대해 어떻게 생각하나요?",
        options: [
          { text: "그냥 언젠가는 되겠지, 아직은 먼 이야기 같다.", type: "A" },
          { text: "아무리 늦어도 2~3년 안에는 준비해야 한다고 생각한다.", type: "B" },
          { text: "지금 바로 계획 세워야 한다. 기회는 빨리 잡아야 한다.", type: "C" }
        ]
      },
      {
        text: "최근 부동산 콘텐츠를 본 이유는?",
        options: [
          { text: "무섭게 오른다니까 그냥 호기심에", type: "A" },
          { text: "살 만한 곳이 어디일까 싶어서 비교용으로", type: "B" },
          { text: "청약이나 분양 타이밍 잡으려고 공부 중이다", type: "C" }
        ]
      }
    ];

    let current = 0;
    let score = { A: 0, B: 0, C: 0 };
    const container = document.getElementById("questionContainer");
    const resultBox = document.getElementById("resultBox");
    const resultText = document.getElementById("resultText");

    function renderQuestion(index) {
      const q = questions[index];
      const div = document.createElement("div");
      div.className = "question-box active";
      div.innerHTML = `<div class="question-text">${q.text}</div>`;
      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.innerText = opt.text;
        btn.onclick = () => {
          score[opt.type]++;
          div.remove();
          current++;
          if (current < questions.length) {
            renderQuestion(current);
          } else {
            showResult();
          }
        };
        div.appendChild(btn);
      });
      container.appendChild(div);
    }

    function showResult() {
      container.style.display = "none";
      resultBox.style.display = "block";
      const maxType = Object.keys(score).reduce((a, b) => (score[a] > score[b] ? a : b));
      const messages = {
        A: "🛌 미루기형 – 아직은 멀었다고 느끼는 당신. 하지만 기회는 기다려주지 않습니다.",
        B: "👀 기회주의형 – 흐름을 살피고 있지만 아직 전략이 부족한 상태입니다.",
        C: "🚀 실행형 – 이미 계획 중이거나 실전에 돌입한 준비된 당신!"
      };
      resultText.innerText = messages[maxType];
    }

    renderQuestion(current);
  </script>
</body>
</html>
