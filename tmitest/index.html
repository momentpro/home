<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 집 마련 성향 테스트 - TMI Test</title>
  <style>
    body { font-family: 'Helvetica Neue', sans-serif; background: #f4f4f4; margin: 0; padding: 0; color: #333; }
    .container { max-width: 720px; margin: 50px auto; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
    h1 { font-size: 28px; margin-bottom: 10px; text-align: center; }
    .intro { font-size: 16px; margin-bottom: 30px; text-align: center; color: #666; }
    .question { margin-bottom: 30px; }
    .question p { font-weight: 600; margin-bottom: 10px; }
    .options label { display: block; padding: 8px 12px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 8px; cursor: pointer; }
    .options input { margin-right: 8px; }
    .submit-btn { display: block; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 20px; }
    .result { display: none; text-align: center; margin-top: 40px; }
    .result h2 { font-size: 22px; margin-bottom: 10px; }
    .result p { font-size: 16px; line-height: 1.6; }
    .cta { margin-top: 30px; padding: 12px 24px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; display: inline-block; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>내 집 마련 성향 테스트</h1>
    <div class="intro">내 집 마련은 운이 아니라 성향의 문제입니다.<br>지금 당신의 태도를 점검해보세요.</div>
    <form id="quizForm">
      <div id="questionList"></div>
      <button type="submit" class="submit-btn">결과 보기</button>
    </form>
    <div class="result" id="resultBox">
      <h2>당신의 성향 결과는?</h2>
      <p id="resultText"></p>
      <a href="https://momentintl.com/tmitest/form" class="cta">내 조건에 맞는 분양 전략 상담받기</a>
    </div>
  </div>
  <script>
    const questions = [
      ["내 집 마련에 대해 어떻게 생각하나요?", "언젠가는 되겠지", "지금부터 준비해야지"],
      ["최근 부동산 정보를 본 적이 있나요?", "거의 없다", "자주 본다"],
      ["집을 산다는 말에 가장 먼저 드는 생각은?", "돈이 없는데 어떻게 사?", "대출 조건부터 확인해야지"],
      ["집을 언제쯤 사야 한다고 생각하나요?", "아직은 아닌 것 같다", "되도록 빨리 움직여야 한다"],
      ["청약, DSR, LTV 용어가 익숙한가요?", "모른다", "대략은 안다"],
      ["분양 공고를 보면?", "나와는 상관없는 얘기", "청약 조건과 분양가부터 체크한다"],
      ["지금 집을 산다면 무엇이 걱정인가요?", "대출 부담과 실수", "정보 부족이나 기회 포착"],
      ["부동산 콘텐츠는 어떻게 소비하나요?", "스크롤만 넘김", "찜하고 저장한다"],
      ["관심 지역의 시세를 확인해본 적 있나요?", "거의 없다", "주기적으로 확인한다"],
      ["친구가 집을 샀다고 했을 때 나는?", "와 대단하다 하고 말음", "자극받고 나도 계획 세운다"],
      ["분양 상담 제안을 받으면?", "아직은 필요 없다", "조건 맞으면 일단 들어본다"],
      ["전세 가격이 오를 때 나는?", "어쩔 수 없지", "이럴 때일수록 계산을 해본다"],
      ["새 집이 나온다고 하면?", "나랑 상관없음", "평면, 가격, 교통부터 비교함"],
      ["집을 선택할 때 가장 중요한 것은?", "가격이 무조건 싸야 함", "입지, 구조, 미래가치 모두 고려"],
      ["실입주금 1억 이하 분양이 있다면?", "뭔가 찜찜해서 미룸", "조건부터 꼼꼼히 따져본다"],
      ["남들 다 사는 분위기일 때 나는?", "지켜보다가 뒤늦게 따라감", "타이밍을 빨리 잡으려 함"],
      ["집을 직접 보러 간다면?", "설명만 듣고 끝냄", "구조, 주변환경까지 체크"],
      ["부모님에게 집 얘기하면?", "나중에 천천히 하라고 함", "지금은 내가 움직일 타이밍"]
    ];

    const questionList = document.getElementById('questionList');
    questions.forEach((q, i) => {
      const div = document.createElement('div');
      div.className = 'question';
      div.innerHTML = `<p>${i + 1}. ${q[0]}</p>
        <div class="options">
          <label><input type="radio" name="q${i + 1}" value="A"> ${q[1]}</label>
          <label><input type="radio" name="q${i + 1}" value="B"> ${q[2]}</label>
        </div>`;
      questionList.appendChild(div);
    });

    const form = document.getElementById('quizForm');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const data = new FormData(form);
      let count = { A: 0, B: 0 };
      for (let pair of data.entries()) {
        count[pair[1]]++;
      }
      form.style.display = 'none';
      resultBox.style.display = 'block';

      if (count.B >= 14) {
        resultText.innerText = '🚀 실행형 - 당신은 이미 준비된 상태입니다. 지금 조건에 맞는 현장을 비교하고 전략을 세워야 할 타이밍입니다.';
      } else if (count.B >= 10) {
        resultText.innerText = '📋 계획형 - 어느 정도 방향은 잡혀 있지만 실행이 부족한 타입입니다. 지금부터 행동으로 옮길 때입니다.';
      } else if (count.B >= 6) {
        resultText.innerText = '👀 기회주의형 - 관심은 있지만 흐름에 따라 움직이는 경향이 강합니다. 내 상황에 맞는 기준을 정해야 할 때입니다.';
      } else if (count.B >= 3) {
        resultText.innerText = '🤯 불안회피형 - 정보는 있지만 걱정이 많아 쉽게 나서지 못합니다. 리스크 낮은 조건부터 차근차근 접근하세요.';
      } else if (count.B >= 1) {
        resultText.innerText = '💡 정보수집형 - 많이 보고 듣지만 아직 방향이 없습니다. 내 조건을 설정하고 전문가와 상담이 필요한 시점입니다.';
      } else {
        resultText.innerText = '🛌 미루기형 - 언젠가 되겠지, 하고 있는 사이 기회는 멀어집니다. 지금 바로 시작해야 할 때입니다.';
      }
    });
  </script>
</body>
</html>
