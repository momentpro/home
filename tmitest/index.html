<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 집 마련 성향 테스트</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 24px;
      color: #333;
      text-align: center;
      margin-bottom: 30px;
    }
    .question {
      margin-bottom: 25px;
    }
    .question p {
      font-weight: bold;
    }
    .options label {
      display: block;
      margin: 5px 0;
      cursor: pointer;
    }
    .submit-btn {
      display: block;
      margin: 30px auto 0;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      display: none;
      text-align: center;
      margin-top: 40px;
    }
    .result h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>내 집 마련 성향 테스트</h1>
    <form id="quizForm">
      <div class="question">
        <p>1. 내 집 마련에 대해 어떻게 생각하나요?</p>
        <div class="options">
          <label><input type="radio" name="q1" value="A"> 언젠가는 되겠지</label>
          <label><input type="radio" name="q1" value="B"> 지금부터 준비해야지</label>
        </div>
      </div>
      <!-- 나머지 질문도 이 패턴으로 19개 추가 예정 -->
      <button type="submit" class="submit-btn">결과 보기</button>
    </form>

    <div class="result" id="resultBox">
      <h2>당신의 성향 결과는...</h2>
      <p id="resultText"></p>
      <a href="#" class="submit-btn">전략 상담 받기</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('quizForm');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const answers = new FormData(form);
      let scoreA = 0;
      let scoreB = 0;
      for (let pair of answers.entries()) {
        if (pair[1] === 'A') scoreA++;
        else scoreB++;
      }
      form.style.display = 'none';
      resultBox.style.display = 'block';
      if (scoreA >= scoreB) {
        resultText.innerText = '🛌 미루기형 - 집은 언젠가 되겠지라고 생각하는 타입입니다. 하지만 지금부터 전략적으로 준비하지 않으면 기회를 놓칠 수 있어요.';
      } else {
        resultText.innerText = '🚀 실행형 - 당신은 이미 준비가 되어있거나, 빠르게 움직일 수 있는 사람입니다. 지금 조건을 확인해보세요.';
      }
    });
  </script>
</body>
</html>
