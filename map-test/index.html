<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>딜하르방 - 제주도민 전용 혜택 지도</title>
    
    <!-- 외부 스타일시트 -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- 광고 시스템 먼저 로드 -->
    <script src="ads.js"></script>
    
    <!-- 페이지 로딩 전 광고 표시 -->
    <style>
        /* 초기 페이지 숨김 */
        .main-app {
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .main-app.loaded {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 테스트 배너 -->
    <div class="test-banner">
        🧪 테스트 환경 - 딜하르방 지도 버전 개발 중
        <button onclick="if(window.AD_SYSTEM) AD_SYSTEM.showAd('test'); else alert('광고 시스템 없음')" style="margin-left: 20px; padding: 4px 8px; font-size: 12px; background: #F7C852; border: none; border-radius: 4px; cursor: pointer;">
            🎯 광고 테스트
        </button>
    </div>

    <div class="main-app">
    <div class="main-container">
        <!-- 사이드바 -->
        <div class="sidebar">
            <!-- 사이드바 헤더 -->
            <div class="sidebar-header">
                <!-- 플로팅 장식 요소 -->
                <div class="floating-deco">🌺</div>
                <div class="floating-deco">🏖️</div>
                <div class="floating-deco">🌊</div>
                <div class="floating-deco">🍊</div>
                
                <h1>딜<span class="deal-highlight">DEAL</span> 하르방</h1>
                <p>제주도에서 만나는 특별한 할인 혜택</p>
            </div>

            <!-- 검색 바 -->
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="매장명 또는 지역을 검색하세요..." id="searchInput">
            </div>

            <!-- 카테고리 필터 -->
            <div class="category-filters">
                <div class="category-title">카테고리</div>
                <div class="category-buttons" id="categoryButtons">
                    <!-- 카테고리 버튼들이 동적으로 생성됩니다 -->
                </div>
            </div>

            <!-- 핫딜 목록 -->
            <div class="hotdeal-section">
                <div class="hotdeal-title">
                    🔥 현재 핫딜 매장
                </div>
                <div id="hotdealList">
                    <!-- 핫딜 목록이 여기에 동적으로 추가됩니다 -->
                </div>
            </div>
        </div>

        <!-- 지도 컨테이너 -->
        <div class="map-container">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <div>지도를 불러오는 중...</div>
            </div>
            <div id="map"></div>
        </div>
    </div>
    </div>

    <!-- JavaScript 파일들 (순서 중요!) -->
    <script src="config.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
    
    <!-- 네이버 지도 API (새로운 통합 버전) -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=ynlmdjv2h1&submodules=geocoder"></script>
</body>
</html>
